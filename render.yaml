services:
  - type: web
    name: cleanlab-api
    runtime: python
    buildCommand: pip install -r backend/app/requirements.txt
    startCommand: python backend/app/server.py
    plan: free
    envVars:
      - key: PORT
        generateValue: false
        value: 10000
      - key: ALLOWED_ORIGIN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /api/health
    autoDeploy: true
