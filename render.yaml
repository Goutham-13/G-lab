services:
  - type: web
    name: clean-lab
    runtime: python
    buildCommand: >
      pip install -r requirements.txt 2>/dev/null ||
      pip install -r backend/requirements.txt 2>/dev/null ||
      pip install -r backend/app/requirements.txt
    startCommand: python backend/app/server.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGIN
        value: https://g-lab.vercel.app
    healthCheckPath: /api/health
    autoDeploy: true
